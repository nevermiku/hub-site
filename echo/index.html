<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>回声 · ECHO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05060c;font-family:'PingFang SC','Microsoft YaHei',sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#top{position:absolute;top:14px;left:0;right:0;text-align:center;color:#cfe3f5;font-size:11px;letter-spacing:2px;text-shadow:0 1px 6px #000}
#score{position:absolute;top:34px;left:0;right:0;text-align:center;color:#fff;font-size:34px;font-weight:300;letter-spacing:3px;text-shadow:0 0 22px #7fa8ff88;font-variant-numeric:tabular-nums}
#echoTag{position:absolute;top:84px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:3px;color:#ff9a6f;opacity:0;transition:opacity .3s}
#echoTag.on{opacity:1}
#tip{position:absolute;bottom:76px;left:0;right:0;text-align:center;font-size:11px;color:#5d7184;line-height:1.9;letter-spacing:1px}
.screen{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,#0a1024,#05060c);z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:8px;padding:26px}
.screen h1{color:#fff;font-size:38px;letter-spacing:12px;font-weight:200;text-shadow:0 0 40px #6f8fff66;margin-bottom:2px}
.screen .en{color:#5a6d8a;font-size:10px;letter-spacing:6px;margin-bottom:18px}
.screen .rule{color:#8fa3ba;font-size:12.5px;line-height:2.1;max-width:330px;margin-bottom:6px}
.screen .rule b{color:#9ec0ff;font-weight:600}
.screen .rule em{color:#ff9a6f;font-style:normal}
.bigbtn{margin-top:16px;border:0;border-radius:40px;padding:14px 46px;font-size:14px;font-weight:600;letter-spacing:6px;
  background:linear-gradient(135deg,#3b5bdb,#7fa8ff);color:#fff;cursor:pointer;box-shadow:0 10px 40px #3b5bdb55}
.bigbtn:active{transform:scale(.96)}
.stat{color:#8fa3ba;font-size:13px;line-height:2.2}
.stat b{color:#fff;font-size:22px;font-weight:300}
.hint{color:#3f5066;font-size:10px;margin-top:18px;letter-spacing:1px}
#best{color:#ff9a6f}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="top">第 <span id="wave">1</span> 波 · 回声延迟 <span id="delay">3.0</span>s</div>
  <div id="score">0</div>
  <div id="echoTag">◈ 回声已同步</div>
  <div id="tip" style="display:none"></div>
</div>
<div class="screen" id="start">
  <h1>回 声</h1>
  <div class="en">E C H O</div>
  <div class="rule">
    你走过的每一步，都会在 <b>3 秒后</b> 被一个「回声」重走一遍。<br>
    它和你一样会撞碎方块、也会被方块撞碎。<br>若被方块和回声 <em>团团困住 2 秒</em>，就会消散。<br><br>
    <em>利用过去的自己绕到死角</em>，拿到那颗发光的核心。
  </div>
  <button class="bigbtn" id="btnStart">开始</button>
  <div class="hint">滑动 / 方向键移动 · 每一步都算数</div>
</div>
<div class="screen" id="over" style="display:none">
  <h1 style="font-size:30px;letter-spacing:8px">回 声 消 散</h1>
  <div class="stat" id="overstat"></div>
  <button class="bigbtn" id="btnRetry">再来</button>
  <div class="hint">历史最高 <span id="best">0</span></div>
</div>
<script>
/* ================= 回声 ECHO =================
   核心机制：玩家每一步都记录到时间轴，3 秒后由「回声」重放。
   回声与玩家共享碰撞规则 —— 玩家撞到回声会停下，回声撞到玩家也会停下。
   这样「过去的自己」既是对手也是帮手：可以当垫脚石挡怪，也会把你堵死。
*/
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',()=>{resize();buildGrid()});resize();

/* ---- 音效 ---- */
let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type='sine',v=.08,slide=0){
  try{const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}catch{}
}
const sfx={
  step:()=>beep(520,.05,'sine',.05),
  break_:()=>beep(180,.13,'triangle',.1,-90),
  echoStep:()=>beep(330,.05,'sine',.035),
  core:()=>{beep(660,.1);setTimeout(()=>beep(880,.1),90);setTimeout(()=>beep(1170,.16),180)},
  hit:()=>beep(120,.18,'sawtooth',.12,-60),
  sync:()=>beep(760,.12,'sine',.06,200),
};

/* ---- 网格 ---- */
const CELL=54;         // 基础格子尺寸（会按屏幕自适应）
let COLS,ROWS,GW,GH,OX,OY;
function buildGrid(){
  const target=Math.min(W,H)*0.86;
  COLS=7;ROWS=7;
  const cs=Math.min(CELL,Math.floor(target/COLS));
  window.CS=cs;GW=CS*COLS;GH=CS*ROWS;
  OX=(W-GW)/2;OY=(H-GH)/2+10;
}
buildGrid();

/* ---- 状态 ---- */
const DELAY=3.0;          // 回声延迟（秒）
const HISTORY_MAX=Math.ceil(DELAY*1000/16); // 帧历史容量
let G=null,running=false,lastT=0;
const ECHO_COLORS=['#ff9a6f','#c9a0ff','#7fd8ff'];

function newGame(){
  buildGrid();
  const g={
    t:0,
    px:3,py:5,            // 网格坐标（浮点，用于平滑插值）
    dx:0,dy:0,            // 当前朝向
    target:null,          // 移动目标格
    hist:[],              // 历史帧 [{x,y,dir}]
    echoes:[],            // 回声实体
    blocks:[],            // 障碍
    cores:[],             // 核心
    particles:[],
    score:0,wave:1,coresGot:0,
    shake:0,dead:false,stuckT:0,
    spawnT:0,
  };
  // 初始布局：中心留空，四周散布方块
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(Math.abs(x-3)<2&&Math.abs(y-5)<2)continue;
    if(Math.random()<0.22)g.blocks.push({x,y,hp:1,shakeT:0});
  }
  spawnCore(g);
  G=g;return g;
}
function spawnCore(g){
  let tries=0;
  while(tries++<60){
    const x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS);
    if(g.blocks.some(b=>b.x===x&&b.y===y))continue;
    if(Math.hypot(x-g.px,y-g.py)<2.2)continue;
    g.cores.push({x,y,t:0});return;
  }
}
function blockAt(g,x,y){return g.blocks.find(b=>b.x===Math.round(x)&&b.y===Math.round(y))}

/* ---- 输入：一次滑动 = 一格 ---- */
let touchStart=null,moveLock=0;
function tryMove(dx,dy){
  if(!running||!G||G.dead)return;
  if(performance.now()<moveLock)return;
  const g=G;
  const nx=Math.round(g.px)+dx, ny=Math.round(g.py)+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  // 撞方块：撞碎它（消耗一步）
  const b=blockAt(g,nx,ny);
  if(b){
    b.hp--; b.shakeT=.25;
    if(b.hp<=0){g.blocks.splice(g.blocks.indexOf(b),1);burst(g,nx,ny,'#6f8fff',10)}
    g.shake=3;sfx.break_();
    g.px=nx;g.py=ny;      // 照样前进（撞即前进，产生推进感）
    moveLock=performance.now()+90;
    return;
  }
  // 撞回声：被挡住
  for(const e of g.echoes){
    if(Math.round(e.x)===nx&&Math.round(e.y)===ny){
      g.shake=2;sfx.hit();return;
    }
  }
  g.px=nx;g.py=ny;g.dx=dx;g.dy=dy;
  moveLock=performance.now()+90;
  sfx.step();
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w')tryMove(0,-1);
  else if(k==='arrowdown'||k==='s')tryMove(0,1);
  else if(k==='arrowleft'||k==='a')tryMove(-1,0);
  else if(k==='arrowright'||k==='d')tryMove(1,0);
});
cv.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener('pointerup',e=>{
  if(!touchStart)return;
  const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(Math.max(ax,ay)<14){touchStart=null;return}
  if(ax>ay)tryMove(dx>0?1:-1,0);else tryMove(0,dy>0?1:-1);
  touchStart=null;
});

function burst(g,gx,gy,c,n){
  for(let i=0;i<n;i++)g.particles.push({x:gx*CS+CS/2+OX,y:gy*CS+CS/2+OY,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,t:.5,c});
}

/* ---- 更新 ---- */
function update(dt){
  const g=G;if(g.dead)return;
  g.t+=dt;
  // 平滑插值到目标格
  g.px+=0; // 网格移动已即时完成，用渲染插值模拟
  // 记录历史（每帧记录玩家位置与朝向）
  g.hist.push({x:g.px,y:g.py,dx:g.dx,dy:g.dy,t:g.t});
  while(g.hist.length>HISTORY_MAX*1.2)g.hist.shift();

  // 回声：取 DELAY 秒前的历史位置
  const wantT=g.t-DELAY;
  if(wantT>0){
    let idx=-1;
    for(let i=g.hist.length-1;i>=0;i--){if(g.hist[i].t<=wantT){idx=i;break}}
    const h=idx>=0?g.hist[idx]:null;
    const nEcho=Math.min(3,Math.floor(g.t/DELAY));
    // 重建回声队列
    if(g.echoes.length!==nEcho){
      while(g.echoes.length<nEcho)g.echoes.push({x:g.px,y:g.py,t:g.t});
      while(g.echoes.length>nEcho)g.echoes.pop();
    }
    for(let k=0;k<nEcho;k++){
      const dSec=DELAY*(k+1);
      const tt=g.t-dSec;
      if(tt<=0)continue;
      let i2=-1;
      for(let i=g.hist.length-1;i>=0;i--){if(g.hist[i].t<=tt){i2=i;break}}
      if(i2>=0){g.echoes[k].x=g.hist[i2].x;g.echoes[k].y=g.hist[i2].y}
    }
  }
  // 回声撞玩家 → 玩家被弹开一格（往回）
  for(const e of g.echoes){
    if(Math.abs(e.x-g.px)<.5&&Math.abs(e.y-g.py)<.5){
      if(!(e.hitT>g.t)){
        e.hitT=g.t+1.2;
        g.shake=5;sfx.hit();
        // 玩家被推回
        const bx=Math.round(g.px)-g.dx,by=Math.round(g.py)-g.dy;
        if(bx>=0&&by>=0&&bx<COLS&&by<ROWS&&!blockAt(g,bx,by)){g.px=bx;g.py=by}
      }
    }
  }
  // 吃核心
  for(let i=g.cores.length-1;i>=0;i--){
    const c=g.cores[i];c.t+=dt;
    if(Math.round(g.px)===c.x&&Math.round(g.py)===c.y){
      g.cores.splice(i,1);g.score+=10;g.coresGot++;
      sfx.core();burst(g,c.x,c.y,'#7fd8ff',18);g.shake=4;
      spawnCore(g);
      // 每吃 5 个升波：增加方块密度
      if(g.coresGot%5===0){
        g.wave++;
        for(let k=0;k<4;k++){
          const x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS);
          if(!blockAt(g,x,y)&&Math.hypot(x-g.px,y-g.py)>1.5)g.blocks.push({x,y,hp:1,shakeT:0});
        }
      }
    }
  }
  // 被困检测：四个方向都无法移动（方块/边界/回声堵死）超过 2 秒 → 消散
  {
    const gx=Math.round(g.px),gy=Math.round(g.py);
    let free=0;
    for(const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=gx+ddx,ny=gy+ddy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(blockAt(g,nx,ny))continue;
      if(g.echoes.some(e=>Math.round(e.x)===nx&&Math.round(e.y)===ny))continue;
      free++;
    }
    if(free===0){ g.stuckT+=dt; if(g.stuckT>2){gameOver();return} }
    else g.stuckT=Math.max(0,g.stuckT-dt*2);
  }
  // 方块抖动衰减，方块会「再生」（压力）
  g.spawnT-=dt;
  if(g.spawnT<=0){
    g.spawnT=Math.max(2.2,6.5-g.wave*.4);
    if(g.blocks.length<COLS*ROWS*0.55){
      const x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS);
      if(!blockAt(g,x,y)&&Math.hypot(x-g.px,y-g.py)>2)g.blocks.push({x,y,hp:1,shakeT:0});
    }
  }
  for(const b of g.blocks)if(b.shakeT>0)b.shakeT-=dt;
  for(let i=g.particles.length-1;i>=0;i--){
    const p=g.particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.t-=dt;
    if(p.t<=0)g.particles.splice(i,1);
  }
  if(g.shake>0)g.shake=Math.max(0,g.shake-dt*18);
}

/* ---- 渲染 ---- */
function draw(){
  const g=G,cs=window.CS;
  ctx.fillStyle='#05060c';ctx.fillRect(0,0,W,H);
  // 背景网格光晕
  const grd=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*.7);
  grd.addColorStop(0,'#0c1226');grd.addColorStop(1,'#05060c');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  ctx.save();
  if(g.shake>0)ctx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);
  // 网格线
  ctx.strokeStyle='rgba(120,150,255,.10)';ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(OX+x*cs,OY);ctx.lineTo(OX+x*cs,OY+GH);ctx.stroke()}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(OX,OY+y*cs);ctx.lineTo(OX+GW,OY+y*cs);ctx.stroke()}

  // 方块
  for(const b of g.blocks){
    const x=OX+b.x*cs, y=OY+b.y*cs;
    const sh=b.shakeT>0?b.shakeT*14:0;
    ctx.save();ctx.translate(x+cs/2+ (Math.random()-.5)*sh, y+cs/2+(Math.random()-.5)*sh);
    const r=cs*.34;
    ctx.fillStyle='rgba(90,120,220,.85)';
    ctx.beginPath();ctx.roundRect(-r,-r,r*2,r*2,6);ctx.fill();
    ctx.strokeStyle='rgba(160,190,255,.55)';ctx.lineWidth=1.5;ctx.stroke();
    // 内部纹路
    ctx.strokeStyle='rgba(200,220,255,.28)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-r*.5,0);ctx.lineTo(r*.5,0);ctx.stroke();
    ctx.restore();
  }

  // 核心
  for(const c of g.cores){
    const cx=OX+c.x*cs+cs/2, cy=OY+c.y*cs+cs/2;
    const pulse=1+Math.sin(c.t*4)*.12;
    const rg=ctx.createRadialGradient(cx,cy,2,cx,cy,cs*.7*pulse);
    rg.addColorStop(0,'rgba(127,216,255,.55)');rg.addColorStop(1,'rgba(127,216,255,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,cs*.7*pulse,0,7);ctx.fill();
    ctx.fillStyle='#bfeaff';
    ctx.save();ctx.translate(cx,cy);ctx.rotate(c.t*1.2);
    ctx.beginPath();
    for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.lineTo(Math.cos(a)*cs*.19,Math.sin(a)*cs*.19)}
    ctx.closePath();ctx.fill();ctx.restore();
  }

  // 回声轨迹（淡淡的残影）
  for(let k=0;k<g.echoes.length;k++){
    const e=g.echoes[k];
    ctx.fillStyle='rgba(255,154,111,'+(0.06+(k*0.03))+')';
    ctx.beginPath();ctx.arc(OX+e.x*cs+cs/2,OY+e.y*cs+cs/2,cs*.3,0,7);ctx.fill();
  }

  // 回声本体
  for(let k=0;k<g.echoes.length;k++){
    const e=g.echoes[k];
    const cx=OX+e.x*cs+cs/2, cy=OY+e.y*cs+cs/2;
    const col=ECHO_COLORS[k%ECHO_COLORS.length];
    ctx.save();
    ctx.globalAlpha=.85;
    ctx.strokeStyle=col;ctx.lineWidth=2;
    ctx.setLineDash([5,4]);ctx.lineDashOffset=-g.t*14;
    ctx.beginPath();ctx.arc(cx,cy,cs*.3,0,7);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=col;ctx.globalAlpha=.35;
    ctx.beginPath();ctx.arc(cx,cy,cs*.22,0,7);ctx.fill();
    ctx.globalAlpha=1;
    // 数字标记
    ctx.fillStyle=col;ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('−'+(k+1),cx,cy);
    ctx.restore();
  }

  // 玩家
  const px=OX+g.px*cs+cs/2, py=OY+g.py*cs+cs/2;
  const pg=ctx.createRadialGradient(px,py,2,px,py,cs*.9);
  pg.addColorStop(0,'rgba(255,255,255,.35)');pg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,cs*.9,0,7);ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(px,py,cs*.27,0,7);ctx.fill();
  // 朝向小缺口
  ctx.fillStyle='#05060c';
  ctx.beginPath();ctx.arc(px+g.dx*cs*.14,py+g.dy*cs*.14,cs*.09,0,7);ctx.fill();

  // 粒子
  for(const p of g.particles){ctx.globalAlpha=Math.max(0,p.t/.5);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)}
  ctx.globalAlpha=1;
  // 被困警告
  if(g.stuckT>0.25){
    const a=Math.min(.75,g.stuckT/2)*(0.6+0.4*Math.sin(g.t*12));
    ctx.strokeStyle='rgba(255,90,110,'+a+')';ctx.lineWidth=3;
    ctx.strokeRect(OX-3,OY-3,GW+6,GH+6);
    ctx.fillStyle='rgba(255,150,160,'+Math.min(1,g.stuckT)+')';
    ctx.font='bold 12px sans-serif';ctx.textAlign='center';
    ctx.fillText('被困住——过去正在吞掉你',(W/2),OY-14);
  }
  ctx.restore();

  // HUD
  document.getElementById('score').textContent=G.score;
  document.getElementById('wave').textContent=G.wave;
  document.getElementById('delay').textContent=DELAY.toFixed(1);
  document.getElementById('echoTag').classList.toggle('on',G.echoes.length>0);
}

function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.max(0,Math.min(.05,(t-lastT)/1000));lastT=t;
  if(!running||!G)return;
  update(dt);draw();
}
requestAnimationFrame(t=>{lastT=t;loop(t)});

/* ---- 开始 / 结束 ---- */
function start(){
  newGame();running=true;ac();
  document.getElementById('start').style.display='none';
  document.getElementById('over').style.display='none';
  lastT=performance.now();
}
function gameOver(){
  running=false;
  const best=Math.max(G.score,Number(localStorage.getItem('echo-best')||0));
  localStorage.setItem('echo-best',String(best));
  document.getElementById('overstat').innerHTML='核心 <b>'+G.score+'</b> · 第 <b>'+G.wave+'</b> 波<br><span style="font-size:11px">共收集 '+G.coresGot+' 颗</span>';
  document.getElementById('best').textContent=best;
  document.getElementById('over').style.display='flex';
}
document.getElementById('btnStart').onclick=start;
document.getElementById('btnRetry').onclick=start;
</script>
</body>
</html>
