<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040a14">
<meta name="description" content="个人项目中枢：项目、任务、创意、财务、日程与 AI 伙伴">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="项目中枢">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>项目中枢 · Project Hub</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
  html,body{margin:0;padding:0;background:#040a14;color:#eaf6f2;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #root{min-height:100vh}
  #boot-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#040a14;z-index:99999;transition:opacity .45s}
  #boot-splash.hide{opacity:0;pointer-events:none}
  #boot-splash img{width:84px;height:84px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
</style>
  <script type="module" crossorigin src="./assets/index-BUBDKuIX.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CJQ4Pzxe.css">
</head>
<body>
<div id="boot-splash"><img src="./icon-192.png" alt=""></div>
<div id="root"></div>
<noscript><div style="padding:24px;text-align:center">请开启 JavaScript 以使用项目中枢</div></noscript>
<script>
  (function(){
    var el=document.getElementById('boot-splash');
    var done=false;
    function hide(){ if(done)return; done=true; el&&el.classList.add('hide');
      setTimeout(function(){ el&&el.parentNode&&el.parentNode.removeChild(el); },600); }
    var root=document.getElementById('root');
    if(root){
      var mo=new MutationObserver(function(){ if(root.children.length){ mo.disconnect(); hide(); } });
      mo.observe(root,{childList:true});
    }
    setTimeout(hide,8000);
  })();
  if('serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(function(reg){
        reg.update().catch(function(){});
        // 新版本安装完成后自动接管并刷新一次，避免用户看到旧缓存
        reg.addEventListener('updatefound',function(){
          var w=reg.installing;
          if(!w)return;
          w.addEventListener('statechange',function(){
            if(w.state==='installed'&&navigator.serviceWorker.controller){
              try{ w.postMessage({type:'SKIP_WAITING'}); }catch(e){}
            }
          });
        });
      }).catch(function(){});
      var reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange',function(){
        if(reloaded)return; reloaded=true; location.reload();
      });
    });
  }
</script>
</body>
</html>
